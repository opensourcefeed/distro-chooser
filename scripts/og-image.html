*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0a1413;color:#e7f1f0;font-family:Inter;position:relative;overflow:hidden}

p{font-size:30px;color:#9cb3b1;margin-top:24px}
.chips{display:flex;gap:12px;margin-top:auto}
.chip{display:flex;align-items:center;gap:10px;border:1px solid #22403e;background:#10201f;border-radius:999px;padding:6px 18px 6px 6px;font-size:22px}
.m{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:SG;font-weight:600;font-size:17px}
